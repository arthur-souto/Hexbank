# Profile de desenvolvimento local.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Habilita: identidade simulada (X-Dev-Principal / X-Dev-Roles), Swagger UI e logs verbosos.
# Nunca usar fora da máquina local.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    persist-authorization: true   # mantém o header do Authorize entre reloads

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,flyway,mappings

logging:
  level:
    com.hexbank: DEBUG
    org.springframework.security: DEBUG
